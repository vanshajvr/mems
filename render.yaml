services:
  - type: web
    name: mems
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./mems.db
      - key: UPLOAD_DIR
        value: uploaded_datasets